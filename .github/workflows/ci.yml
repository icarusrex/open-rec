name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openadr
          POSTGRES_PASSWORD: openadr
          POSTGRES_DB: openadr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openadr -d openadr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check src tests

      - name: Start the VTN (openleadr-rs, version pinned in docker-compose.yml)
        run: |
          PGPASSWORD=openadr psql -h localhost -U openadr -d openadr -c "CREATE DATABASE openrec_test"
          docker run -d --name vtn --network host \
            -e DATABASE_URL=postgres://openadr:openadr@localhost:5432/openadr \
            -e OAUTH_TYPE=INTERNAL \
            -e OAUTH_BASE64_SECRET="$(openssl rand -base64 32)" \
            -e OAUTH_TOKEN_URL=http://localhost:3000/auth/token \
            ghcr.io/openleadr/openleadr-rs:v0.2.7
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/programs || true)
            [ "$code" = "401" ] && echo "VTN up" && exit 0
            sleep 2
          done
          docker logs vtn; exit 1

      - name: Test (unit + live VTN)
        env:
          OPENREC_TEST_VTN_URL: http://localhost:3000
          OPENREC_TEST_VTN_DATABASE_URL: postgresql://openadr:openadr@localhost:5432/openadr
          OPENREC_TEST_DATABASE_URL: postgresql://openadr:openadr@localhost:5432/openrec_test
        run: pytest -v

      - name: VTN logs on failure
        if: failure()
        run: docker logs vtn || true

  compose-smoke:
    # Runs the real stack (docker compose: Postgres, VTN, open-rec image) and one live
    # publish against OMIE and Open-Meteo, the two data sources the unit tests only mock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure .env
        run: |
          cp .env.example .env
          sed -i "s|^PG_PASSWORD=.*|PG_PASSWORD=ci|" .env
          sed -i "s|^OAUTH_BASE64_SECRET=.*|OAUTH_BASE64_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^OPENREC_DATABASE_URL=.*|OPENREC_DATABASE_URL=postgresql://openadr:ci@db:5432/openrec|" .env
          # This job checks live forecasts/prices without a Home Assistant meter.
          sed -i 's|^HA_HOUSE_ENERGY_ENTITY=.*|HA_HOUSE_ENERGY_ENTITY=|' .env

      - name: Start Postgres and the VTN
        run: |
          docker compose up -d db vtn
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/programs)" = "401" ] && exit 0
            sleep 2
          done
          docker compose logs; exit 1

      - name: Build the open-rec image and bootstrap VTN clients
        run: |
          docker compose build service
          docker compose run --rm service open-rec bootstrap --apply \
            --vtn-database-url postgresql://openadr:ci@db:5432/openadr 2> secrets.txt
          sed -i '/^VTN_BL_CLIENT_SECRET=$/d;/^VEN_CLIENT_SECRET=$/d' .env
          grep -E '^(VTN_BL_CLIENT_SECRET|VEN_CLIENT_SECRET)=' secrets.txt >> .env

      - name: Live publish of today's market day (OMIE + Open-Meteo)
        run: |
          DAY=$(TZ=Europe/Madrid date +%F)
          docker compose run --rm service open-rec publish --day "$DAY" | tee publish.txt
          grep -E "'prices': (92|96|100)" publish.txt
          grep -E "'complete': True" publish.txt

      - name: Logs on failure
        if: failure()
        run: docker compose logs

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned HA runtime and test runner
        run: pip install homeassistant==2026.2.0 pytest pytest-asyncio
      - name: Heater controller runtime regressions (actuator mocked)
        run: pytest tests/ha -v
