name: Website

on:
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test helpers, data and generated pages
        working-directory: website
        run: npm test
      - name: Build static website
        working-directory: website
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: openrec-website
          path: website/dist

