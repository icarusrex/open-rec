[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-rec"
version = "0.1.0"
description = "Open-source tools to run a Portuguese energy community (autoconsumo coletivo) with an OpenADR 3 VTN"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyomie>=1.2",
    "aiohttp>=3.9",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
open-rec = "openrec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B905"]
